name: render-diagrams
on:
  workflow_dispatch:
  push:
    paths:
      - "diagrams/source/*.mmd"
      - ".github/workflows/render-diagrams.yml"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Render editable Mermaid sources to SVG and PNG
        run: |
          npm install -g @mermaid-js/mermaid-cli
          printf '%s\n' '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > /tmp/puppeteer-config.json
          for f in diagrams/source/*.mmd; do
            n="${f%.mmd}"
            mmdc -p /tmp/puppeteer-config.json -i "$f" -o "$n.svg" -b white
            mmdc -p /tmp/puppeteer-config.json -i "$f" -o "$n.png" -b white -s 2
          done
      - name: Commit rendered diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagrams/source/*.svg diagrams/source/*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs(diagrams): render Mermaid SVG and PNG"
            git push
          fi
