name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
  education-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/train_smoke.py
      - name: API live readiness and prediction
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          with TestClient(app) as client:
              assert client.get("/health/live").status_code == 200
              assert client.get("/health/ready").status_code == 200
              r = client.post("/predict", json={"text":"I love this service"})
              assert r.status_code == 200, r.text
              assert abs(sum(r.json()["probabilities"].values()) - 1) < 1e-6
              print("PASS: trained baseline, readiness, prediction")
          PY
      - name: Check artifact
        run: ls -lh artifacts/ && df -h .
  container:
    runs-on: ubuntu-latest
    needs: [quality, education-smoke]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sentiment-intelligence:ci .
